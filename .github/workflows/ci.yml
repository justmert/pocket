name: CI

# Runs the gate the pre-commit hook used to run, on the server instead of on
# every local commit: extension `npm run check` (tsc + tsc tests + eslint + both
# vitest configs), the indexer's typecheck and tests, and contracts formatting.
on:
  push:
  pull_request:

# a newer push to the same ref supersedes an in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # extension is an npm workspace: the lockfile is at the repo root, so install
      # there (which provisions the workspace) and run its check via --prefix.
      - run: npm ci
      # `check:ci` is the self-contained gate: tsc (src + tests) + eslint + the src
      # unit tests. It deliberately drops the `tests/` suites that `check` also runs
      # -- those are the full-environment tier and need a built .output, the
      # indexer's better-sqlite3, and internal files under resources/ (gitignored,
      # not in a public checkout), so they run in the local release gate, not here.
      # circuits.test.ts skips itself when the vendored circuits are absent.
      - run: npm --prefix extension run check:ci

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --check
