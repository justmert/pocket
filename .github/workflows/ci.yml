name: CI

# Runs the gate the pre-commit hook used to run, on the server instead of on
# every local commit: extension `npm run check` (tsc + tsc tests + eslint + both
# vitest configs), the indexer's typecheck and tests, and contracts formatting.
on:
  push:
  pull_request:

# a newer push to the same ref supersedes an in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # extension is an npm workspace: the lockfile is at the repo root, so install
      # there (which provisions the workspace) and run its check via --prefix.
      - run: npm ci
      # `check` includes circuits.test.ts, which reads the compiled circuit
      # artifacts. Those are the audited OpenZeppelin circuits, vendored from the
      # pinned upstream at build time and NOT committed here (committing them would
      # invite a tampering question). The test skips itself when they are absent,
      # so a bare CI checkout stays green; the local build and the release gate run
      # it with the circuits vendored. bb.js and SRS are not needed by `check`.
      - run: npm --prefix extension run check

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --check
