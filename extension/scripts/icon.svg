<!-- Source for public/icon/*.png and the landing favicon. Chrome discovers
     icons by size from public/icon/<size>.png and does not accept SVG, so only
     the rasterised PNGs ship; this is the vector they come from.

     The Pocket P mark on a white rounded field. The mark is dark, so the field
     is light: the mirror of the old dark-field mark, and it reads on a light AND
     a dark browser toolbar without needing a second variant.

     Regenerate with:
       for s in 16 32 48 128; do
         rsvg-convert -w $s -h $s scripts/icon.svg -o public/icon/$s.png
       done -->
